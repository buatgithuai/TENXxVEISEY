<script type="module">

const cfg={apiKey:"AIzaSyAaP8UCuWWdI4za5JZVVgjbl4ccucGvvgc",authDomain:"veiseyxtenx.firebaseapp.com",projectId:"veiseyxtenx",storageBucket:"veiseyxtenx.firebasestorage.app",messagingSenderId:"354918321706",appId:"1:354918321706:web:c243f021612891f0cb7d53",measurementId:"G-R3WY1S5MR1"};
// URL Cloudflare Worker (R2) untuk simpan foto bukti. Kosong = foto terkompresi disimpan di Firestore.
const CF_URL="";
// =========================================================================
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updateProfile,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection as Fc,doc as Fd,getDoc as Fg,getDocs,setDoc as Fs,query,limit,runTransaction as Frt,serverTimestamp as Fts,writeBatch as Fwb}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const fb=initializeApp(cfg),au=getAuth(fb),db=getFirestore(fb);
const collection=Fc,doc=Fd,getDoc=Fg,setDoc=Fs,runTransaction=Frt,writeBatch=Fwb,serverTimestamp=Fts;
const $=s=>document.querySelector(s),rp=n=>(n<0?"-":"")+"Rp"+Math.abs(Math.round(n||0)).toLocaleString("id-ID");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const isO=()=>me.role.startsWith("owner"),isV=()=>me.role=="owner_veisey";

// ===== AUTH + AUTO SETUP =====
let lm="in";
const loginUI=(msg="")=>{let em="";try{em=localStorage.getItem("tx_em")||""}catch(e){}
$("#app").innerHTML=`<div class="lw"><i class="bl b1"></i><i class="bl b2"></i><i class="bl b3"></i><div class="login"><div class="lg">T×V</div><h2>${lm=="in"?"Selamat datang":"Buat akun baru"}</h2><p class="mu" style="margin:0">TENX × VEISEY Production System</p>
<div class="tb"><button type="button" class="${lm=="in"?"on":""}" data-m="in">Masuk</button><button type="button" class="${lm=="up"?"on":""}" data-m="up">Daftar</button></div>
<div class="fl" ${lm=="in"?"hidden":""}><input id="nm" placeholder=" " autocomplete="name"><label for="nm">Nama lengkap</label></div>
<div class="fl"><input id="em" type="email" placeholder=" " autocomplete="email" inputmode="email" value="${esc(em)}"><label for="em">Email</label></div>
<div class="fl"><input id="pw" type="password" placeholder=" " autocomplete="${lm=="in"?"current-password":"new-password"}"><label for="pw">Kata sandi (min. 6)</label><button type="button" id="eye" class="eye" aria-label="Tampilkan kata sandi">👁</button></div>

<label class="rm"><input type="checkbox" id="rm" ${em?"checked":""}> Ingat email saya</label>
<p class="neg" id="er" role="alert">${esc(msg)}</p>
<button class="b gb" id="go">${lm=="in"?"Masuk":"Buat akun"}</button>
<p class="mu" style="text-align:center;margin:14px 0 0">${lm=="in"?'<a href="#" id="fg">Lupa kata sandi?</a>':"Pemilik pertama yang mendaftar menjalankan setup awal database. Akun berikutnya menunggu diberi peran."}</p></div></div>`;
setTimeout(()=>$(em?"#pw":"#em")?.focus(),50)};

async function ensure(u,name){
 const ur=doc(db,"users",u.uid),s=await getDoc(ur);if(s.exists())return s.data();
 const first=!(await getDoc(doc(db,"meta","setup"))).exists();let role="pending",party="";
 if(first){party=(prompt("SETUP AWAL: Anda pemilik pertama. Ketik TENX atau VEISEY")||"").toUpperCase();
  if(!["TENX","VEISEY"].includes(party))throw Error("Pilih TENX atau VEISEY");role="owner_"+party.toLowerCase()}
 const p={name:name||u.email,email:u.email,role,party,active:role!="pending",created:serverTimestamp()};
 await setDoc(ur,p);
 if(first){const b=writeBatch(db);
  b.set(doc(db,"meta","setup"),{done:true,by:u.uid,at:serverTimestamp()});
  b.set(doc(db,"meta","counter"),{inv:0});
  b.set(doc(db,"settings_versions","v1"),{ver:1,eff:new Date().toISOString().slice(0,10),fee:600,elec:"kWh × tarif",rev:"Kas diterima",split:50,by:u.uid,at:serverTimestamp()});
  ["Tali tissue|pcs","Kertas sublim|lembar","Tinta sublim|ml","Plastik packing|pcs","Lakban|roll","Kertas transfer|lembar"].forEach((x,i)=>{const[n,un]=x.split("|");
   b.set(doc(db,"materials","M"+(i+1)),{code:"M"+(i+1),name:n,unit:un,min:0,bal:0,avg:0,active:true})});
  b.set(doc(collection(db,"audit_logs")),{actor:u.uid,name:p.name,role,action:"SETUP_AWAL",ent:"meta",id:"setup",after:null,reason:"Seed roles, pengaturan, bahan",at:serverTimestamp()});
  await b.commit()}
 return p}
const E={"auth/invalid-email":"Format email tidak valid.","auth/email-already-in-use":"Email sudah terdaftar. Gunakan tab Masuk.","auth/weak-password":"Kata sandi minimal 6 karakter.","auth/invalid-credential":"Email atau kata sandi salah.","auth/user-not-found":"Akun tidak ditemukan. Daftar dulu.","auth/wrong-password":"Kata sandi salah.","auth/too-many-requests":"Terlalu banyak percobaan. Coba lagi beberapa menit lagi.","auth/network-request-failed":"Tidak ada koneksi internet.","auth/operation-not-allowed":"Email/Password belum diaktifkan di Firebase Authentication.","auth/unauthorized-domain":"Domain ini belum ditambahkan di Authorized domains Firebase."};
const okEm=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
const fail=m=>{const er=$("#er"),c=$(".login");er.className="neg";er.textContent=m;c.classList.remove("sk");void c.offsetWidth;c.classList.add("sk")};
const busy=(on)=>{const g=$("#go");if(!g)return;g.disabled=on;g.textContent=on?"Memproses…":(lm=="in"?"Masuk":"Buat akun")};
async function submitLogin(){const em=$("#em").value.trim(),pw=$("#pw").value,nm=($("#nm")?.value||"").trim();$("#er").textContent="";
 if(lm=="up"&&!nm)return fail("Isi nama lengkap."),$("#nm").focus();
 if(!okEm(em))return fail("Format email tidak valid. Contoh: nama@gmail.com"),$("#em").focus();
 if(pw.length<6)return fail("Kata sandi minimal 6 karakter."),$("#pw").focus();
 busy(true);
 try{try{$("#rm").checked?localStorage.setItem("tx_em",em):localStorage.removeItem("tx_em")}catch(e){}
  if(lm=="in")await signInWithEmailAndPassword(au,em,pw);
  else{const c=await createUserWithEmailAndPassword(au,em,pw);await updateProfile(c.user,{displayName:nm});await ensure(c.user,nm)}}
 catch(x){busy(false);fail(E[x.code]||x.message)}}
document.addEventListener("click",async e=>{const t=e.target,id=t.id;
 if(t.dataset?.m){lm=t.dataset.m;return loginUI()}
 if(id=="eye"){const p=$("#pw"),h=p.type=="password";p.type=h?"text":"password";t.textContent=h?"🙈":"👁";return}
 if(id=="fg"){e.preventDefault();const em=$("#em").value.trim();if(!okEm(em))return fail("Isi email Anda dulu, lalu tekan Lupa kata sandi."),$("#em").focus();
  try{await sendPasswordResetEmail(au,em);const er=$("#er");er.className="pos";er.textContent="Tautan reset kata sandi dikirim ke "+em+". Cek inbox atau folder spam."}catch(x){fail(E[x.code]||x.message)}return}
 if(id=="go")submitLogin()});

  b.style.width=(v?Math.max(1,sc)*25:0)+"%";b.style.background=sc<2?"var(--bad)":sc<3?"var(--wa)":"var(--ac)";$("#sg span").textContent=v?L[v.length<6?0:sc]:"Kekuatan kata sandi"}});

 if(!u){me=null;return loginUI()}

async function calc(m){
 const[pay,wo,rq,ex,inv]=await Promise.all([L("payments"),L("work_orders"),L("stock_requests"),L("expenses"),L("invoices")]);
 const cash=pay.filter(p=>mo(p.date)==m).reduce((s,p)=>s+p.amount,0);
 const nota=inv.filter(i=>mo(i.at)==m&&i.status!="Batal").reduce((s,i)=>s+i.total,0);
 const hpp=rq.filter(r=>r.status=="POSTED"&&r.cost&&mo(r.decAt)==m).reduce((s,r)=>s+r.cost,0);
 const pcs=wo.filter(w=>mo(w.at)==m).reduce((s,w)=>s+w.qty,0);
 const fee=pcs*(ST.fee||600),lis=ex.filter(x=>x.status=="POSTED"&&x.period==m).reduce((s,x)=>s+x.amount,0);
 const net=cash-hpp-fee-lis,sh=net>0?net*(ST.split||50)/100:0;
 return{cash,nota,hpp,pcs,fee,lis,net,sh,piutang:nota-cash}}
